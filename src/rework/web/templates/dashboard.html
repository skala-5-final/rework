{% extends "base.html" %}
{% block content %}
<div class="grid-2">
  <section class="card">
    <h2>새 분석 작업</h2>
    <form id="job-form" class="stack">
      <label>작업 이름 <input name="name" value="ST001 6월 판매 실적 보고서 인수인계" required></label>
      <label>원천 데이터 (CSV) <input name="source" type="file" accept=".csv" required></label>
      <label>완성 보고서 (PDF) <input name="report" type="file" accept=".pdf" required></label>
      <label class="check"><input name="inject_failure" type="checkbox"> 장애 시연: 첫 도구 호출을 일시적으로 실패시켜 큐 재시도를 확인</label>
      <button class="primary" type="submit">분석 시작</button>
      <p class="muted small" id="job-status-msg"></p>
      <p class="error" id="job-error"></p>
    </form>
  </section>
  <section class="card">
    <h2>업무 지식 (RAG)</h2>
    <p class="muted small">보고서 작성 지침·데이터 사전을 등록하면 Agent가 계산 규칙을 정할 때 근거로 검색합니다. 담당자가 확인한 답변도 여기에 쌓입니다.</p>
    <form id="doc-form" class="stack">
      <label>문서 제목 <input name="title" required></label>
      <label>파일 (.md / .txt) <input name="file" type="file" accept=".md,.txt" required></label>
      <button type="submit">등록</button>
      <p class="error" id="doc-error"></p>
    </form>
    <ul id="doc-list" class="doc-list"></ul>
  </section>
</div>
<section class="card">
  <h2>작업 목록</h2>
  <table class="table" id="job-table">
    <thead><tr><th>작업</th><th>상태</th><th>입력</th><th>갱신</th></tr></thead>
    <tbody></tbody>
  </table>
</section>
{% endblock %}
{% block script %}<script>initDashboard()</script>{% endblock %}
