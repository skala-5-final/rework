<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Re:Work{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%231d4ed8'/><text x='8' y='12' font-size='10' text-anchor='middle' fill='white' font-family='sans-serif'>R</text></svg>">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Re:Work <span>보고서 인수인계 Agent</span></a>
    {% if user %}
    <div class="who">{{ user.display_name }} <button class="link" id="logout">로그아웃</button></div>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script src="/static/app.js"></script>
  {% block script %}{% endblock %}
</body>
</html>
