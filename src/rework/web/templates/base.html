<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Re:Work{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%231d4ed8'/><text x='8' y='12' font-size='10' text-anchor='middle' fill='white' font-family='sans-serif'>R</text></svg>">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Rework 홈">
      <span class="brand-logo" aria-hidden="true">
        <svg class="brand-symbol" viewBox="0 0 40 40" fill="none">
          <path d="M28 6.5A16 16 0 1 0 32 28" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"/>
          <path d="M12 15h13M12 25h10" stroke="#111520" stroke-width="3.3" stroke-linecap="round"/>
          <path d="M12 20h7M27 29l9-10 2 13" stroke="currentColor" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-wordmark"><span>Re</span>work</span>
      </span>
      <span class="brand-description">보고서 인수인계 Agent</span>
    </a>
    {% if user %}
    <div class="who">{{ user.display_name }} <button class="link" id="logout">로그아웃</button></div>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script src="/static/app.js"></script>
  {% block script %}{% endblock %}
</body>
</html>
