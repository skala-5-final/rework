services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rework
      POSTGRES_PASSWORD: rework
      POSTGRES_DB: rework
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rework"]
      interval: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
